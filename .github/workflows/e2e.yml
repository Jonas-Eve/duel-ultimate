name: E2E (manual)

# Manual only (#78): the Playwright tests never run on pull_request or push, to spare CI quota.
# Run it from the Actions tab, notably before merging a change that touches the game flow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.node-version

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal -t wasm32-unknown-unknown --no-self-update && rustup default stable

      - name: Install wasm-bindgen-cli at the version of Cargo.lock
        run: |
          start=$SECONDS
          V=$(node apps/web/scripts/build-wasm.mjs --print-version)
          cargo install wasm-bindgen-cli --version "$V" --locked
          echo "wasm-bindgen-cli $V installed in $((SECONDS - start))s"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # The Chromium of the e2e run: the local CLI, at the version of package-lock.json (no
      # version here, no unpinned `npx` package). `--with-deps` installs the system libraries.
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Builds again (`pree2e`, so the wasm too), then drives the production build served on 127.0.0.1.
      - name: E2E web
        working-directory: apps/web
        run: npm run e2e
