[workspace]
resolver = "3"
members = ["crates/engine", "crates/cards", "crates/simulator", "crates/server", "crates/engine-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Aucune entropie système : tout le hasard vient de la graine du moteur. Ne jamais activer
# `getrandom/wasm_js` ni les features par défaut de `rand` (rand::rng(), StdRng, OsRng).
rand = { version = "0.10.3", default-features = false }
rand_chacha = "0.10.0"
thiserror = "2.0.21"
# Parseur XML pour les tests de validation des SVG (dev-dependency de duel-cards seulement).
roxmltree = "0.21.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.8.9", features = ["ws"] }
wasm-bindgen = "0.2.129"
serde-wasm-bindgen = "0.6.5"
duel-engine = { path = "crates/engine" }
duel-cards = { path = "crates/cards" }
